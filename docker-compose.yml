services:
  clawdr:
    build: .
    ports:
      - "8000:8000"
      - "3000:3000"
    volumes:
      # Persist project config across restarts
      - config:/root/.config/clawdr
      # Mount host's Claude auth so the container can run `claude rc`.
      # On first run, either:
      #   1. Mount your existing auth: ~/.claude:/root/.claude
      #   2. Or run: docker exec -it clawdr claude auth login
      #      and complete the OAuth flow in your browser
      #   3. Or set ANTHROPIC_API_KEY for API key auth (Console billing)
      - ${CLAUDE_AUTH_DIR:-~/.claude}:/root/.claude
      # Mount project directories so claude rc can access them.
      # Add your own project paths here.
      - ${HOME}:/host-home:ro
    environment:
      - CLAWDR_CONFIG=/root/.config/clawdr/config.yaml
      - CLAWDR_BROWSE_ROOT=/host-home
      # Set this for API key auth instead of OAuth:
      # - ANTHROPIC_API_KEY=sk-ant-...
    restart: unless-stopped

volumes:
  config:
